name: Hell release preparation and optional publication
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Existing mix.exs release version (e.g. 0.1.1)
      git_ref:
        type: string
        required: true
        default: main
        description: main or the trusted vVERSION tag to prepare
      publish:
        type: boolean
        required: false
        default: false
        description: Publish package and docs to Hex (requires git_ref vVERSION)
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'gsmlg-dev/hell' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_REF: ${{ inputs.git_ref }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Validate inputs before checkout
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_REF" == main || "$RELEASE_REF" == "v$RELEASE_VERSION" ]]
          if [[ "$RELEASE_PUBLISH" == true ]]; then
            [[ "$RELEASE_REF" == "v$RELEASE_VERSION" ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
      - name: Validate repository and release identity
        run: mix run --no-compile --no-deps-check --no-start scripts/check_release.exs
      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
        env:
          MIX_ENV: test
      - run: mix docs
      - run: mix hex.build
      - name: Validate built package through its public API
        run: bash scripts/artifact_smoke.sh "hell-$RELEASE_VERSION.tar" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hell-${{ inputs.version }}-candidate
          path: |
            hell-${{ inputs.version }}.tar
            doc/
          if-no-files-found: error
      - name: Publish Hell package and documentation
        if: inputs.publish && inputs.git_ref == format('v{0}', inputs.version)
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          RELEASE_ARTIFACT: hell-${{ inputs.version }}.tar
        run: |
          test -n "$HEX_API_KEY"
          mix run --no-compile --no-deps-check --no-start scripts/check_release.exs
          status=$(curl --silent --show-error --location --max-time 30 \
            --output "$RUNNER_TEMP/hell-package-name.json" --write-out '%{http_code}' \
            https://hex.pm/api/packages/hell)
          if [[ "$status" == 200 ]]; then
            python3 - "$RUNNER_TEMP/hell-package-name.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response:
              package = json.load(response)
          if package.get("name") != "hell" or package.get("meta", {}).get("links", {}).get("GitHub") != "https://github.com/gsmlg-dev/hell":
              raise SystemExit("Existing Hex package does not identify gsmlg-dev/hell")
          PY
          elif [[ "$status" != 404 ]]; then
            echo "Hex package hell identity or availability could not be verified (HTTP $status)" >&2
            exit 1
          fi
          release_status=$(curl --silent --show-error --location --max-time 30 \
            --output "$RUNNER_TEMP/hell-release-version.json" --write-out '%{http_code}' \
            "https://hex.pm/api/packages/hell/releases/$RELEASE_VERSION")
          if [[ "$release_status" != 404 ]]; then
            echo "Hex release $RELEASE_VERSION already exists or its availability could not be verified (HTTP $release_status)" >&2
            exit 1
          fi
          mix hex.publish --yes
